<!-- ============================================================
     EverAfterWear — Botón "Pagar con Pi" MAINNET (dinero REAL)
     ------------------------------------------------------------
     DÓNDE PEGARLO: en el tema DUPLICADO de Shopify, en la plantilla
     del CARRITO (cart), como bloque de "Liquid personalizado" o
     pegado en el archivo de la plantilla del carrito.

     MONTO: lee el total del carrito en USD (Liquid) y lo convierte
     a Pi con la tasa EAW_PI_RATE. Tasa de mercado fijada el
     2026-10-11: 1 Pi = $0.083 USD. AJUSTAR LA TASA AQUÍ cuando
     el precio del Pi se mueva.

     SERVIDOR: https://pi-payments-mainnet.onrender.com (Mainnet,
     sandbox: false = pagos REALES a la App Wallet de la tienda).
     ============================================================ -->

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<div style="margin: 16px 0;">
  <button id="eaw-pay-pi" type="button"
    style="background:#000; color:#d4af37; border:2px solid #d4af37; border-radius:10px;
           padding:14px 22px; font-size:16px; font-weight:bold; cursor:pointer; width:100%;">
    🥧 Pagar <span id="eaw-pi-amount">…</span> con Pi
  </button>
  <p style="font-size:12px; text-align:center; color:#666; margin-top:6px;">
    Total del carrito convertido a Pi (tasa: 1 Pi = $0.083 USD)
  </p>
  <p id="eaw-pi-msg" style="margin-top:8px; font-size:14px; text-align:center;"></p>
  <p style="font-size:12px; text-align:center; color:#666;">
    El pago con Pi solo funciona abriendo la tienda desde el Pi Browser.
    Al recibir tu pago, confirmamos y preparamos tu pedido.
  </p>
</div>

<script>
  // Servidor de pagos Pi — MAINNET (dinero real)
  var EAW_PI_SERVER = "https://pi-payments-mainnet.onrender.com";

  // Tasa de la tienda: cuántos USD vale 1 Pi (mercado, 2026-10-11)
  var EAW_PI_RATE = 0.083;

  // Total del carrito inyectado por Shopify (Liquid, en USD)
  var cartUsd = {{ cart.total_price | divided_by: 100.0 }};
  var amount = Math.max(Math.round((cartUsd / EAW_PI_RATE) * 100) / 100, 0.01);

  Pi.init({ version: "2.0", sandbox: false });

  function eawMsg(texto) {
    document.getElementById("eaw-pi-msg").textContent = texto;
  }

  // Muestra el monto en el botón (o avisa si el carrito está vacío)
  var btn = document.getElementById("eaw-pay-pi");
  var amtEl = document.getElementById("eaw-pi-amount");
  if (typeof cartUsd === "number" && cartUsd > 0) {
    amtEl.textContent = amount + " π";
  } else {
    amtEl.textContent = "";
    btn.disabled = true;
    btn.style.opacity = "0.5";
    eawMsg("Tu carrito está vacío: agrega un producto para pagar con Pi.");
  }

  // Si quedó un pago a mitad, se lo avisamos al servidor
  function onIncompletePaymentFound(payment) {
    fetch(EAW_PI_SERVER + "/incomplete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paymentId: payment.identifier })
    }).catch(function () {});
    eawMsg("Tienes un pago de Pi pendiente de completar. Escríbenos pa' ayudarte.");
  }

  btn.addEventListener("click", async function () {
    var orderId = "EAW-" + Date.now();

    try {
      eawMsg("Conectando con tu wallet de Pi…");
      await Pi.authenticate(["payments"], onIncompletePaymentFound);

      var paymentData = {
        amount: amount,
        memo: "EverAfterWear — orden " + orderId,
        metadata: { orderId: orderId, store: "everafterwear.store", cartUsd: cartUsd, rate: EAW_PI_RATE }
      };

      var callbacks = {
        onReadyForServerApproval: function (paymentId) {
          fetch(EAW_PI_SERVER + "/approve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentId: paymentId })
          }).catch(function () { eawMsg("Error avisando al servidor. Intenta de nuevo."); });
        },
        onReadyForServerCompletion: function (paymentId, txid) {
          fetch(EAW_PI_SERVER + "/complete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentId: paymentId, txid: txid })
          })
            .then(function () { eawMsg("✅ ¡Pago con Pi completado! Gracias por tu compra — confirmamos tu pedido al verificar el pago."); })
            .catch(function () { eawMsg("El pago se hizo, pero falló el aviso final. Guarda tu comprobante."); });
        },
        onCancel: function () {
          eawMsg("Pago cancelado. Puedes intentarlo de nuevo cuando quieras.");
        },
        onError: function (error) {
          eawMsg("Hubo un error con el pago de Pi: " + (error && error.message ? error.message : error));
        }
      };

      Pi.createPayment(paymentData, callbacks);
    } catch (e) {
      eawMsg("No se pudo iniciar el pago. Abre la tienda desde el Pi Browser e intenta de nuevo.");
    }
  });
</script>
